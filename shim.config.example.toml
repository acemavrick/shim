# Copy to shim.config.toml and fill in. That file is gitignored.
# Everything here is optional: the compiler runs with no keys at all.
# Environment variables override these values.

[keys]
# Used at compile time for browser decisions, tools and descriptions.
# Without a key or CLI provider the compiler uses deterministic markup inference.
anthropic = ""          # or export ANTHROPIC_API_KEY

[model]
provider = "anthropic" # anthropic | codex-cli | auto (key first, then CLI)
name = "claude-sonnet-5"
naming = true           # false disables model-assisted naming entirely
# CLI mode reuses `codex login` authentication. No Anthropic key is required.
# codex_binary = "codex" # or an absolute path to the desktop app's newer CLI
# codex_model = "..."    # optional; otherwise reuse ~/.codex/config.toml's model
codex_reasoning_effort = "low"
timeout = 180           # seconds per CLI response

[compile]
max_pages = 12
request_gap = 0.35      # seconds between requests; politeness
crawl_concurrency = 4  # overlap page downloads; 1 restores serial crawling
check_concurrency = 4  # overlap independent GET checks and model proposals
agent_steps = 16       # maximum browser decisions; write-down is one extra call
respect_robots = true
user_agent = "shim-compiler/0.1 (site-to-agent translation layer)"

# Verify non-read actions. Only ever enable for sites you own -- it fires
# real writes (bookings, orders, messages) at whatever you point it at.
allow_writes = false
# Exploration sends POSTs like a visitor would, except checkout/order/payment/
# delete paths and credential fields. A POST ships as a read tool only on
# observed evidence plus a two-input check. Escape hatch for a lookup the
# explorer could not observe: declare the exact request (complete body).
# [[safety.read_post_rules]]
# url = "https://your-site.example/api/lookup"
# body = { operation = "list_public_items" }
